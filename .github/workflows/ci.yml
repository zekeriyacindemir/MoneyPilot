name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneypilot
          POSTGRES_PASSWORD: moneypilot_test_password
          POSTGRES_DB: moneypilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U moneypilot -d moneypilot_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://moneypilot:moneypilot_test_password@localhost:5432/moneypilot_test?schema=public
      DATABASE_URL: postgresql://moneypilot:moneypilot_test_password@localhost:5432/moneypilot_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=@moneypilot/api
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Check that migrations match the Prisma schema
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code
      - run: npm test --workspace=@moneypilot/api
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: docker build -f docker/api.Dockerfile -t moneypilot-api:ci .
      - run: docker build -f docker/api.Dockerfile --target migrate -t moneypilot-migrate:ci .
      - run: docker build -f docker/web.Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.example.com -t moneypilot-web:ci .
